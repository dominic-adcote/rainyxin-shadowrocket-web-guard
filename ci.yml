name: Validate Shadowrocket module

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test
        run: npm run check

      - name: Verify generated module is committed
        run: git diff --exit-code -- modules/rainyxin-web-guard.sgmodule
