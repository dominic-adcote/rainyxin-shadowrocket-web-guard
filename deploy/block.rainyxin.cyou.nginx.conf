limit_req_zone $binary_remote_addr zone=adcote_block_page:10m rate=15r/s;

server {
    listen 9999 ssl http2;
    listen [::]:9999 ssl http2;
    server_name block.rainyxin.cyou;

    ssl_certificate /etc/ssl/adcote-block-page/fullchain.pem;
    ssl_certificate_key /etc/ssl/adcote-block-page/key.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=adcote_block_page burst=40 nodelay;
        proxy_pass http://127.0.0.1:9998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
}
